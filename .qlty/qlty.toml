# Committed so the local CLI, the pre-push hook and any CI run use the same
# configuration. For a guide, see https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  ".claude/**",
  ".codex/**",
  ".planning/**",
  ".qlty/**",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "zizmor"
