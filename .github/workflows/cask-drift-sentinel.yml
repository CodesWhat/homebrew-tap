name: cask-drift-sentinel

# Answers one question daily: does every cask in this tap still match the
# release it is supposed to be serving?
#
# Only the careerrat cask has a pusher in this repository. portwing, sockguard
# and idlescreen are committed here by their own projects' release tooling, so
# if one of those pushes stops happening there is nothing on this side that
# notices -- the tap just keeps serving an old version, indefinitely and
# silently. This job is the thing that notices. It is deliberately blind to how
# a cask gets updated, and checks only that it matches.
#
# On divergence the job fails, which surfaces as a red run on the repository.
# It does not open an issue: this org's issue trackers are for reports from
# users, not for findings automation produced.

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  versions:
    name: cask versions match upstream releases
    runs-on: ubuntu-latest
    # Four `gh release list` calls; observed runtime is under 30 seconds. The
    # ceiling is a runaway guard, not a performance budget, so it sits well
    # above that rather than near it.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare every cask against its upstream release
        run: bash scripts/check-cask-drift.sh

  urls:
    name: cask download URLs still resolve
    # Separate from the version check on purpose. A version can be correct
    # while the asset it points at has been renamed or deleted, and this pass
    # is slow and network-dependent enough that it should not be able to mask
    # the fast check above.
    runs-on: macos-latest
    # Observed runtime is around 2m30s. Generous because this pass downloads
    # from every url stanza and a slow upstream is not a failure, but bounded
    # because a wedged download here burns macOS minutes at 10x until the
    # 6-hour default fires.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the casks against live download URLs
        # Scoped to this step rather than the job: nothing above it needs a
        # GitHub credential, and harden-runner and checkout should not be
        # handed one they have no use for.
        #
        # `brew audit --online` resolves every GitHub release asset through
        # the API. Unauthenticated that is 60 requests an hour counted against
        # the runner's shared egress IP rather than against this repository,
        # so the quota is routinely already spent by someone else's job on the
        # same host and this one fails naming whichever cask it happened to
        # reach first. It failed that way on 2026-08-30 (careerrat,
        # idlescreen, portwing) and 2026-09-02 (sockguard), which reads as
        # four separate cask problems and is one credential problem.
        #
        # Homebrew reads this variable specifically. GH_TOKEN, which the
        # version job above sets so `gh` can authenticate, does nothing here.
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/audit-casks.sh --online
