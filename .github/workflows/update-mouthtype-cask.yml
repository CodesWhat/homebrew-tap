name: update-mouthtype-cask

# Watches CodesWhat/mouthtype for a new published release and updates
# Casks/mouthtype.rb to match by opening a pull request from a
# mouthtype/vX.Y.Z branch. Main requires a PR and a passing `audit every cask`
# check, and auto-merge lands the PR once that check passes. The cask
# body comes from mouthtype's own scripts/generate-homebrew-cask.sh, which
# downloads the published release DMG and hashes it, so the sha256 provably
# matches what users download.
#
# Runs on a schedule and on manual dispatch. Uses only this repo's
# GITHUB_TOKEN; no cross-repo credential exists on either side. If the cask
# already matches the latest release, every run is a clean no-op. The cask is
# audited before the branch is pushed, and again by cask-ci on the PR.
#
# Generation and publishing are separate jobs. Generation runs upstream code
# (the generator script from the other repo) and `brew audit` evaluates the
# generated Ruby, so it only gets a read-only token. Publishing holds the write
# credential, so the credential is never present while upstream code runs.
#
# The generator is read from mouthtype's default branch, so a release newer
# than the cask needs scripts/generate-homebrew-cask.sh to have reached main
# there first.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  generate:
    name: generate the mouthtype cask
    # macOS so the generated cask can be audited here, before it is pushed,
    # rather than after users can already install it. The generator needs only bash, curl, shasum, awk and grep, all of which are
    # native here (it calls PlistBuddy solely to read packaging/Version.plist when
    # --version is omitted, and this workflow always passes it).
    runs-on: macos-latest
    # Observed at under a minute, including the release download the generator
    # hashes. Leaving it able to sit wedged for six hours is the worst of the
    # four.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      changed: ${{ steps.cask.outputs.changed }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # No credential is persisted: this job runs upstream code, and the push
      # happens in the publish job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CodesWhat/mouthtype
          path: mouthtype-src
          persist-credentials: false
      - name: Resolve the latest published mouthtype release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/resolve-mouthtype-release.sh
      - name: Regenerate and audit the cask
        id: cask
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mouthtype-src/scripts/generate-homebrew-cask.sh --version "$VERSION" --write Casks/mouthtype.rb
          if git diff --quiet -- Casks/mouthtype.rb; then
            echo "Generated cask is identical; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Audit before publishing. Scoped to mouthtype so an unrelated cask
          # that another project pushed broken cannot block this release.
          bash scripts/audit-casks.sh mouthtype
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Upload the generated cask
        if: steps.cask.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouthtype-cask
          path: Casks/mouthtype.rb
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish the mouthtype cask
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write pushes the mouthtype/ branch, pull-requests: write opens
    # the PR and enables auto-merge, actions: write dispatches cask-ci on the
    # branch (a PR opened with GITHUB_TOKEN does not start workflows itself).
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mouthtype-cask
          path: ${{ runner.temp }}/cask
      # This job never runs upstream code and never evaluates the cask. The
      # script requires the generated file to equal the current cask except
      # for its version and sha256 values, then commits it to a branch and
      # opens a PR. The push credential exists only for the push command and is
      # never written to .git/config.
      - name: Verify the generated cask and open a PR
        env:
          VERSION: ${{ needs.generate.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-mouthtype-cask.sh
