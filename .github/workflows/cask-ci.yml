name: cask-ci

# Validates every cask in the tap before it reaches users. Every change to main
# goes through a pull request, and the `audit every cask` job below is the
# required check on it. The publishers reach main two ways. GoReleaser in
# portwing and sockguard pushes the cask to a portwing-<version> or
# sockguard-<version> branch, and cask-pr-open.yml opens the PR. The
# mouthtype workflow that lives here opens its own PR, and dilated and
# idlescreen open PRs from their release jobs. cask-pr-merge.yml merges a
# cask-only PR after this audit passes, so no auto-merge setting is needed. A
# malformed cask breaks `brew install` for everyone who has tapped this repo,
# so it is worth catching in seconds rather than in a bug report.
#
# Offline audit only. See scripts/audit-casks.sh for why `brew style` is not a
# gate here, and cask-drift-sentinel.yml for the online URL checks.

on:
  # No path filter here: `audit every cask` is a required check, and a required
  # check that is skipped by a path filter blocks unrelated PRs forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - "scripts/**"
      - ".github/workflows/cask-ci.yml"
      - ".github/workflows/update-mouthtype-cask.yml"
  # A pull request opened with GITHUB_TOKEN does not start workflows, so
  # update-mouthtype-cask.yml and cask-pr-open.yml dispatch this workflow
  # on the branch. The check
  # run lands on the branch head commit, which satisfies the required check.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: cask-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit every cask
    # Linux Homebrew evaluates these macOS-only casks for macOS through
    # `--os=macos --arch=all`. Verified identical to a macOS runner on
    # 2026-11-17, including deliberately broken depends_on and sha256 stanzas.
    # Ubuntu also avoids the org-wide macOS queue.
    runs-on: ubuntu-latest
    # Offline audit, observed at under 90 seconds. See cask-drift-sentinel.yml
    # for why every job in this repo carries a ceiling.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu runners ship Homebrew off PATH. Update it in place rather than
      # use Homebrew/actions, which the org's allowed-actions policy rejects;
      # an outdated brew lacks the `brew trust` the audit script runs.
      - name: Set up Homebrew
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update --quiet
          brew --version
          dirname "$(command -v brew)" >> "$GITHUB_PATH"
      - name: Test isolated audit trust and cleanup
        run: bash scripts/audit-casks.test.sh
      - name: Test cask drift release selection
        run: bash scripts/check-cask-drift.test.sh
      - name: Test Mouthtype release version selection
        run: python3 scripts/update-mouthtype.test.py
      - name: Test Mouthtype cask publish validation
        run: python3 scripts/publish-mouthtype-cask.test.py
      - name: Test cask PR eligibility
        run: bash scripts/cask-pr-eligible.test.sh
      - name: Test cask PR file list filter
        run: bash scripts/cask-pr-files.test.sh
      - name: Test cask PR merge decision
        run: bash scripts/cask-pr-merge-decision.test.sh
      - name: Test cask PR opener
        run: bash scripts/open-cask-pr.test.sh
      - name: Audit the casks
        run: bash scripts/audit-casks.sh
