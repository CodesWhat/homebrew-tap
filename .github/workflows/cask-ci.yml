name: cask-ci

# Validates every cask in the tap before, and immediately after, it reaches
# users. Four separate automations commit to this repository's main branch --
# the careerrat workflow that lives here, plus GoReleaser in portwing and
# sockguard and idlescreen's own release job -- and until this workflow existed
# none of them had anything checking that what they pushed was installable. A
# malformed cask breaks `brew install` for everyone who has tapped this repo,
# so it is worth catching in seconds rather than in a bug report.
#
# Offline audit only. See scripts/audit-casks.sh for why `brew style` is not a
# gate here, and cask-drift-sentinel.yml for the online URL checks.

on:
  pull_request:
    paths:
      - "Casks/**"
      - "scripts/**"
      - ".github/workflows/cask-ci.yml"
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - "scripts/**"
      - ".github/workflows/cask-ci.yml"
  # update-careerrat-cask.yml pushes its cask bump with the default
  # GITHUB_TOKEN, and GitHub deliberately does not start workflows from such a
  # push, to stop workflows triggering themselves. So the `push` trigger above
  # never fires for the one automation that lives in this repository -- exactly
  # the cask that would go unaudited. workflow_run is not subject to that rule.
  # The cross-repo pushes (portwing, sockguard, idlescreen) authenticate as
  # something other than this repo's GITHUB_TOKEN, so `push` does cover those.
  workflow_run:
    workflows: [update-careerrat-cask]
    types: [completed]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: cask-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit every cask
    # macOS because the tap ships macOS-only casks; `brew audit --cask` needs a
    # macOS host to evaluate their depends_on stanzas honestly.
    runs-on: macos-latest
    # A failed updater run pushed nothing, so there is no new state to audit.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the casks
        run: bash scripts/audit-casks.sh
