name: cask-pr-merge

# Merges a cask-only pull request after cask-ci passes on it. Main requires a PR
# and a passing `audit every cask` check with no review, and this workflow is
# the only thing that merges. GitHub auto-merge is not used: it attaches to the
# PR rather than the commit that was checked, so a later push could merge
# unchecked content.
#
# Two triggers. workflow_run covers cask-ci runs started by a person or a
# pull_request event. GitHub does not fire workflow_run for runs started with
# GITHUB_TOKEN, which is how scripts/open-cask-pr.sh dispatches cask-ci, so that
# script waits for the run to pass and then dispatches this workflow with the
# run id (workflow_dispatch is allowed from GITHUB_TOKEN).
#
# Why both are safe: each always runs the definition on main, so a pull request
# or a pushed branch cannot change what this workflow does (the dispatch job
# also requires github.ref to be main). Nothing from the PR is ever checked out
# or run here. Only main is checked out, for scripts/. A dispatch input is never
# trusted: the run id is read back from the API and must be a successful,
# completed cask-ci run of this repository, and the sha and branch come from
# that run. Everything after that (exact sha, compare against main,
# eligibility, --match-head-commit) is identical for both triggers.
#
# Why the exact sha: the merge uses --match-head-commit with the head sha of
# the cask-ci run, and the file list comes from a compare between two shas
# (the PR's base sha and that head sha), so what was audited, what was
# inspected and what merges are the same commit. If the head moved, this exits
# and the new head's own cask-ci run comes back here.
#
# Why the audit can be trusted: an eligible PR changes only Casks/<name>.rb, so
# it cannot have changed .github/ or scripts/, and the cask-ci that passed ran
# main's workflow and scripts. The decision logic is in
# scripts/cask-pr-merge-decision.sh so it can be tested.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] runs main's definition, never checks out PR code
    workflows: [cask-ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: cask-ci run id whose branch head should be merged
        required: true
        type: string

permissions: {}

jobs:
  merge:
    name: merge a cask-only PR
    if: >-
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Merge the PR if it is cask-only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ inputs.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::notice::run_id is not a number. Nothing to merge."
              exit 0
            fi
            run="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")"
            if ! jq -e --arg repo "$GH_REPO" '
                .path == ".github/workflows/cask-ci.yml" and
                .status == "completed" and
                .conclusion == "success" and
                .repository.full_name == $repo and
                .head_repository.full_name == $repo' <<<"$run" >/dev/null; then
              echo "::notice::Run $RUN_ID is not a completed, successful cask-ci run of this repository. Nothing to merge."
              exit 0
            fi
            HEAD_SHA="$(jq -r '.head_sha' <<<"$run")"
            HEAD_BRANCH="$(jq -r '.head_branch' <<<"$run")"
          fi
          prs="$(gh pr list --head "$HEAD_BRANCH" --state open \
            --json number,headRefOid,baseRefName,isCrossRepository,isDraft)"
          if [ "$(jq length <<<"$prs")" != 1 ]; then
            echo "::notice::Expected one open PR for $HEAD_BRANCH, found $(jq length <<<"$prs"). Nothing to merge."
            exit 0
          fi
          pr="$(jq -r '.[0].number' <<<"$prs")"
          pr_sha="$(jq -r '.[0].headRefOid' <<<"$prs")"
          base_ref="$(jq -r '.[0].baseRefName' <<<"$prs")"
          cross="$(jq -r '.[0].isCrossRepository' <<<"$prs")"
          draft="$(jq -r '.[0].isDraft' <<<"$prs")"
          # Compare against main's current tip, not the PR's base. The base can
          # be retargeted between reads, but the diff that matters is always
          # the one against main, and a PR retargeted at merge time merges into
          # that other branch, never into main.
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"

          # One unpaginated call. cask-pr-files.jq rejects 300 or more files
          # (the compare API's cap) and any filename that is not a plain cask.
          files="$(gh api "repos/$GH_REPO/compare/$main_sha...$HEAD_SHA" \
            | jq -r -f scripts/cask-pr-files.jq)"
          decision="$(printf '%s\n' "$files" | bash scripts/cask-pr-merge-decision.sh \
            "$HEAD_BRANCH" "$pr_sha" "$HEAD_SHA" "$base_ref" "$cross" "$draft")"
          if [ "$decision" != merge ]; then
            echo "::notice::PR #$pr left for a human. ${decision#skip: }"
            exit 0
          fi
          # A dispatched run and a workflow_run can arrive for the same PR
          # seconds apart (a person's push starts cask-ci on its own). The
          # loser of that race is not a failure.
          if ! out="$(gh pr merge "$pr" --squash --match-head-commit "$HEAD_SHA" 2>&1)"; then
            if grep -q "Merge already in progress" <<<"$out" ||
              [ "$(gh pr view "$pr" --json state --jq .state)" = MERGED ]; then
              echo "::notice::PR #$pr was merged by another cask-pr-merge run."
              bash scripts/delete-merged-branch.sh "$pr" "$HEAD_BRANCH"
              exit 0
            fi
            printf '%s\n' "$out" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          # delete_branch_on_merge does not fire for a merge made with
          # GITHUB_TOKEN, so the head branch is removed here. It never fails
          # the job: the merge already happened.
          bash scripts/delete-merged-branch.sh "$pr" "$HEAD_BRANCH"
